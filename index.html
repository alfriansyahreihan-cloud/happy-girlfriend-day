<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Girlfriend Day! ❤️</title>
  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffe6ea 0%, #ffc3a0 100%);
    }

    /* ==========================================
       HALAMAN 1: MINIGAME TANGKAP HATI
       ========================================== */
    #gameScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      padding: 20px;
      text-align: center;
    }

    .game-title {
      font-family: 'Sacramento', cursive;
      font-size: 3rem;
      color: #fff;
      text-shadow: 2px 2px 10px rgba(255, 75, 114, 0.5);
      margin-bottom: 10px;
    }

    .game-instructions {
      color: #fff;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.25);
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      margin-bottom: 25px;
      font-weight: 600;
    }

    .score-board {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4b72;
      background: white;
      padding: 8px 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .flying-heart {
      position: absolute;
      font-size: 2.8rem;
      cursor: pointer;
      animation: float 3s infinite ease-in-out alternate;
      transition: transform 0.1s;
    }
    .flying-heart:active { transform: scale(1.3); }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-25px) rotate(15deg); }
    }

    /* ==========================================
       HALAMAN 2: UTAMA (TRANSISI BERURUTAN)
       ========================================== */
    #mainScreen {
      display: none;
      width: 100vw;
      height: 100vh;
      padding: 15px;
      align-items: center;
      justify-content: center;
    }

    .card-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 25px;
      width: 100%;
      max-width: 420px;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25);
      border: 2px solid #fff;
      overflow-y: auto;
    }

    /* KELAS UNTUK ANIMASI MUNCUL (FADE IN) */
    .fade-sequence {
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      width: 100%;
      text-align: center;
    }
    
    .fade-sequence.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .header-title {
      font-family: 'Sacramento', cursive;
      font-size: 2.8rem;
      color: #ff4b72;
      line-height: 1.1;
      margin-top: 5px;
      margin-bottom: 20px;
    }

    .photo-frame {
      width: 100%;
      height: 230px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      border: 4px solid #fff;
      flex-shrink: 0;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Box Teks Custom */
    .custom-text-box {
      background: #fff0f3;
      border: 2px dashed #ffb3c1;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      color: #555;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: center;
    }

    /* Interactive Section */
    .interactive-question {
      width: 100%;
      padding-top: 15px;
      border-top: 1px solid #ffe1e6;
    }
    .question-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ff4b72;
    }
    .yes-no-btns {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 40px;
    }
    
    .btn {
      background: #ff4b72;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 75, 114, 0.3);
      transition: all 0.2s ease;
    }
    #btnNo {
      position: absolute;
      background: #fff;
      color: #ff4b72;
      border: 2px solid #ff4b72;
    }
  </style>
</head>
<body>

  <!-- ==================== HALAMAN 1: MINIGAME ==================== -->
  <div id="gameScreen">
    <h1 class="game-title">Catch My Love! 💖</h1>
    <p class="game-instructions">Tangkap 5 hati untuk membuka hadiahmu! 💌</p>
    <div class="score-board">Hati Terkumpul: <span id="score">0</span> / 5</div>
    
    <div id="heartContainer"></div>
  </div>

  <!-- ==================== HALAMAN 2: UTAMA ==================== -->
  <div id="mainScreen">
    <div class="card-container">
      
      <!-- 1. Teks Judul -->
      <div class="fade-sequence">
        <h1 class="header-title">Happy Girlfriend Day! ❤️</h1>
      </div>

      <!-- 2. Foto Pacar -->
      <div class="fade-sequence">
        <div class="photo-frame">
          <img src="foto.jpg" alt="Foto Pacar">
        </div>
      </div>

      <!-- 3. Teks Custom dari Kamu -->
      <div class="fade-sequence">
        <div class="custom-text-box">
          Terima kasih ya udah selalu ada dan bikin hari-hariku jauh lebih indah. Aku beruntung banget punya kamu. Tetap sama aku terus ya, manis! ✨🥰
        </div>
      </div>

      <!-- 4. Pertanyaan & Tombol Kabur -->
      <div class="fade-sequence">
        <div class="interactive-question">
          <p class="question-title">Sayang gak sama aku? 🥺</p>
          <div class="yes-no-btns">
            <button class="btn" onclick="jawabYa()">Sayang Banget! ❤️</button>
            <button class="btn" id="btnNo" onmouseover="kabur()" onclick="kabur()">Gak 😜</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ==========================================
    // 1. MINIGAME LOGIC
    // ==========================================
    let score = 0;
    const targetScore = 5;

    function createHeart() {
      const container = document.getElementById('heartContainer');
      const heart = document.createElement('div');
      heart.classList.add('flying-heart');
      heart.innerHTML = '💖';
      
      const x = Math.random() * (window.innerWidth - 80) + 20;
      const y = Math.random() * (window.innerHeight - 200) + 120;
      
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;

      heart.onclick = () => {
        score++;
        document.getElementById('score').innerText = score;
        heart.remove();

        if (score < targetScore) {
          createHeart();
        } else {
          finishGame();
        }
      };

      container.appendChild(heart);
    }

    createHeart();
    createHeart();

    function finishGame() {
      efekConfetti();
      setTimeout(() => {
        // Pindah layar
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'flex';
        
        // Jalankan transisi muncul berurutan
        mulaiTransisi();
      }, 600);
    }

    // ==========================================
    // 2. LOGIKA TRANSISI MUNCUL (FADE SEQUENCE)
    // ==========================================
    function mulaiTransisi() {
      const elements = document.querySelectorAll('.fade-sequence');
      
      elements.forEach((el, index) => {
        // Setiap elemen diberi jeda 800 milidetik (0.8 detik) sebelum muncul
        setTimeout(() => {
          el.classList.add('visible');
        }, index * 800); 
      });
    }

    // ==========================================
    // 3. EFEK & INTERAKSI TOMBOL KABUR
    // ==========================================
    function efekConfetti() {
      confetti({
        particleCount: 60,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff4b72', '#ff79c6', '#ffffff']
      });
    }

    function kabur() {
      const btnNo = document.getElementById('btnNo');
      const x = Math.random() * 140 - 70;
      const y = Math.random() * 60 - 30;
      btnNo.style.transform = `translate(${x}px, ${y}px)`;
    }

    function jawabYa() {
      alert("Yeay! Aku juga sayang banget sama kamu! 🥰❤️");
      efekConfetti();
    }
  </script>
</body>
</html>
