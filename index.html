<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Girlfriend Day! ❤️</title>
  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #ffe6ea 0%, #ffc3a0 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #4a4a4a;
    }
    .card-container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
      border: 2px solid #fff;
    }
    h1 {
      font-family: 'Sacramento', cursive;
      font-size: 2.8rem;
      color: #ff4b72;
      margin-bottom: 5px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 20px;
    }
    .photo-frame {
      width: 100%;
      height: 260px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      border: 4px solid #fff;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .message-box {
      background: #fff0f3;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px dashed #ffb3c1;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #555;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      background: #ff4b72;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 75, 114, 0.3);
      transition: all 0.3s ease;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-secondary {
      background: #fff;
      color: #ff4b72;
      border: 2px solid #ff4b72;
    }
    /* Section Tombol Kabur */
    .interactive-question {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #ffe1e6;
      position: relative;
    }
    .question-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ff4b72;
    }
    .yes-no-btns {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 45px;
    }
    #btnNo {
      position: absolute;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <h1>Happy Girlfriend Day! ❤️</h1>
    <p class="subtitle">Special page just for you ✨</p>

    <!-- FOTO PACAR (Ganti 'foto.jpg' dengan nama file foto pacar kamu) -->
    <div class="photo-frame">
      <img src="foto.jpg" alt="Foto Pacar">
    </div>

    <!-- KATA-KATA UCAPAN UTAMA -->
    <div class="message-box" id="textDisplay">
      Klik tombol di bawah untuk lihat pesan dari aku! 🥰
    </div>

    <div class="btn-group">
      <button class="btn" onclick="tampilPesanSatuPerSatu()">Klik Pesan / Alasan Sayang 💌</button>
      <button class="btn btn-secondary" onclick="efekHati()">Kirim Cinta / Confetti 🎉</button>
    </div>

    <!-- FITUR INTERAKTIF GEMESIN (Tombol Kabur) -->
    <div class="interactive-question">
      <p class="question-title">Sayang gak sama aku? 🥺</p>
      <div class="yes-no-btns">
        <button class="btn" style="padding: 8px 25px;" onclick="jawabYa()">Banget! ❤️</button>
        <button class="btn btn-secondary" id="btnNo" style="padding: 8px 25px;" onmouseover="kabur()" onclick="kabur()">Gak 😜</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // TULIS / EDIT KATA-KATA KAMU DI SINI
    // ==========================================
    const kataKata = [
      "Terima kasih ya udah selalu ada buat aku dan bikin hari-hariku lebih berwarna. 🌸",
      "Kamu itu bukan cuma pacar, tapi juga teman cerita terbaik aku! ✨",
      "Aku paling suka kalau kamu lagi senyum, manisnya nular sampai ke aku. 😁",
      "Selamat Hari Girlfriend! Semoga kita bisa terus tumbuh bareng-bareng ya. ❤️",
      "Jangan lupa makan & senyum hari ini, cantik! 💖"
    ];

    let indexPesan = 0;

    function tampilPesanSatuPerSatu() {
      const textDisplay = document.getElementById('textDisplay');
      textDisplay.innerText = kataKata[indexPesan];
      indexPesan = (indexPesan + 1) % kataKata.length;
      efekHati();
    }

    // Efek Hati (Confetti)
    function efekHati() {
      confetti({
        particleCount: 40,
        spread: 60,
        origin: { y: 0.7 },
        colors: ['#ff4b72', '#ff8fa3', '#ffffff']
      });
    }

    // Tombol "Gak" yang kabur-kaburan
    function kabur() {
      const btnNo = document.getElementById('btnNo');
      const x = Math.random() * (window.innerWidth < 400 ? 120 : 200) - 60;
      const y = Math.random() * 100 - 50;
      btnNo.style.transform = `translate(${x}px, ${y}px)`;
    }

    function jawabYa() {
      alert("Yeay! Aku juga sayang banget sama kamu! 🥰❤️");
      efekHati();
    }
  </script>
</body>
</html>
