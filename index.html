<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Girlfriend Day! ❤️</title>
  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffe6ea 0%, #ffc3a0 100%);
    }

    /* ==========================================
       HALAMAN 1: MINIGAME TANGKAP HATI
       ========================================== */
    #gameScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      padding: 20px;
      text-align: center;
    }

    .game-title {
      font-family: 'Sacramento', cursive;
      font-size: 3rem;
      color: #fff;
      text-shadow: 2px 2px 10px rgba(255, 75, 114, 0.5);
      margin-bottom: 10px;
    }

    .game-instructions {
      color: #fff;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.25);
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      margin-bottom: 25px;
      font-weight: 600;
    }

    .score-board {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4b72;
      background: white;
      padding: 8px 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    /* Target Hati Terbang */
    .flying-heart {
      position: absolute;
      font-size: 2.8rem;
      cursor: pointer;
      animation: float 3s infinite ease-in-out alternate;
      transition: transform 0.1s;
    }
    .flying-heart:active {
      transform: scale(1.3);
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-25px) rotate(15deg); }
    }

    /* ==========================================
       HALAMAN 2: UTAMA (FULLSCREEN & RESPONSIVE)
       ========================================== */
    #mainScreen {
      display: none;
      width: 100vw;
      height: 100vh;
      padding: 15px;
      align-items: center;
      justify-content: center;
    }

    .card-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25);
      border: 2px solid #fff;
      overflow-y: auto;
    }

    .header-title {
      font-family: 'Sacramento', cursive;
      font-size: 2.8rem;
      color: #ff4b72;
      line-height: 1.1;
      margin-top: 5px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 12px;
    }

    /* Frame Foto Pas Layar */
    .photo-frame {
      width: 100%;
      height: 230px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      margin-bottom: 12px;
      border: 4px solid #fff;
      flex-shrink: 0;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Style Terminal */
    .terminal-box {
      width: 100%;
      background: #1e1e1e;
      border-radius: 15px;
      padding: 12px 15px;
      margin-bottom: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      text-align: left;
      font-family: 'Fira Code', monospace;
      font-size: 0.82rem;
      min-height: 100px;
      cursor: pointer;
    }

    .terminal-header {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    
    .terminal-content {
      color: #a9dc76;
      line-height: 1.4;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background-color: #ff79c6;
      margin-left: 3px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Interactive Section */
    .interactive-question {
      width: 100%;
      padding-top: 10px;
      border-top: 1px solid #ffe1e6;
    }
    .question-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ff4b72;
    }
    .yes-no-btns {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 40px;
    }
    
    .btn {
      background: #ff4b72;
      color: white;
      border: none;
      padding: 8px 22px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 75, 114, 0.3);
      transition: all 0.2s ease;
    }
    #btnNo {
      position: absolute;
      background: #fff;
      color: #ff4b72;
      border: 2px solid #ff4b72;
    }
  </style>
</head>
<body>

  <!-- ==================== HALAMAN 1: MINIGAME ==================== -->
  <div id="gameScreen">
    <h1 class="game-title">Catch My Love! 💖</h1>
    <p class="game-instructions">Tangkap 5 hati untuk membuka pesan rahasia! 💌</p>
    <div class="score-board">Hati Terkumpul: <span id="score">0</span> / 5</div>
    
    <!-- Hati yang terbang di-generate via JavaScript -->
    <div id="heartContainer"></div>
  </div>

  <!-- ==================== HALAMAN 2: UTAMA ==================== -->
  <div id="mainScreen">
    <div class="card-container">
      <div>
        <h1 class="header-title">Happy Girlfriend Day! ❤️</h1>
        <p class="subtitle">Executing love_script.js...</p>
      </div>

      <!-- FOTO PACAR -->
      <div class="photo-frame">
        <img src="foto.jpg" alt="Foto Pacar">
      </div>

      <!-- TERMINAL (Klik pada terminal untuk ganti pesan) -->
      <div class="terminal-box" onclick="nextMessage()">
        <div class="terminal-header">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="terminal-content">
          <span style="color: #ff79c6;">&gt;</span> <span id="textTerminal"></span><span class="cursor"></span>
        </div>
      </div>

      <!-- FITUR INTERAKTIF (Tombol Kabur) -->
      <div class="interactive-question">
        <p class="question-title">Sayang gak sama aku? 🥺</p>
        <div class="yes-no-btns">
          <button class="btn" onclick="jawabYa()">Sayang Banget! ❤️</button>
          <button class="btn" id="btnNo" onmouseover="kabur()" onclick="kabur()">Gak 😜</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. MINIGAME LOGIC
    // ==========================================
    let score = 0;
    const targetScore = 5;

    function createHeart() {
      const container = document.getElementById('heartContainer');
      const heart = document.createElement('div');
      heart.classList.add('flying-heart');
      heart.innerHTML = '💖';
      
      // Random posisi di layar
      const x = Math.random() * (window.innerWidth - 80) + 20;
      const y = Math.random() * (window.innerHeight - 200) + 120;
      
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;

      heart.onclick = () => {
        score++;
        document.getElementById('score').innerText = score;
        heart.remove();

        if (score < targetScore) {
          createHeart();
        } else {
          finishGame();
        }
      };

      container.appendChild(heart);
    }

    // Spawn 2 hati pertama
    createHeart();
    createHeart();

    function finishGame() {
      efekConfetti();
      setTimeout(() => {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'flex';
        nextMessage(); // Jalankan ketikan pesan pertama
      }, 600);
    }

    // ==========================================
    // 2. KATA-KATA UCAPAN TERMINAL
    // EDIT ISI PESAN DI SINI
    // ==========================================
    const messages = [
      "System.out.println('Halo pacar aku yang paling cantik!');",
      "Loading... 100% Cinta aku gak bakal pernah berkurang.",
      "Terima kasih udah selalu ada dan bikin hari-hariku indah ✨",
      "Error 404: Alasan untuk gak sayang kamu TIDAK DITEMUKAN! 🤪",
      "Happy Girlfriend Day ya manis! Tetap sama aku terus ya ❤️",
      "(Klik kotak terminal ini untuk ulang pesan 🔄)"
    ];

    let msgIndex = 0;
    let charIndex = 0;
    let isTyping = false;
    const speed = 40;

    function typeWriter() {
      const currentMsg = messages[msgIndex];
      const terminalEl = document.getElementById("textTerminal");

      if (charIndex < currentMsg.length) {
        terminalEl.innerHTML += currentMsg.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, speed);
      } else {
        isTyping = false;
      }
    }

    function nextMessage() {
      if (isTyping) return;
      
      const terminalEl = document.getElementById("textTerminal");
      terminalEl.innerHTML = "";
      charIndex = 0;
      isTyping = true;
      
      typeWriter();
      msgIndex = (msgIndex + 1) % messages.length;
    }

    // ==========================================
    // 3. EFEK & INTERAKSI
    // ==========================================
    function efekConfetti() {
      confetti({
        particleCount: 60,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff4b72', '#ff79c6', '#ffffff']
      });
    }

    function kabur() {
      const btnNo = document.getElementById('btnNo');
      const x = Math.random() * 140 - 70;
      const y = Math.random() * 60 - 30;
      btnNo.style.transform = `translate(${x}px, ${y}px)`;
    }

    function jawabYa() {
      alert("Yeay! Command Executed: I Love You Too! 🥰❤️");
      efekConfetti();
    }
  </script>
</body>
</html>
